name: Release DevAI CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer from the DevAI pyproject.toml
        required: true
        type: string
      ref:
        description: Trusted branch or tag in tesserix/devai
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: release-devai-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14-large
            runner_arch: X64
            arch: amd64
          - runner: macos-14
            runner_arch: ARM64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tap tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out private DevAI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tesserix/devai
          ref: ${{ inputs.ref }}
          path: source
          ssh-key: ${{ secrets.DEVAI_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: source/pyproject.toml

      - name: Verify release input and runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("source/pyproject.toml").read_text())["project"]
          if project["version"] != os.environ["VERSION"]:
              raise SystemExit(f"version mismatch: pyproject={project['version']} input={os.environ['VERSION']}")
          PY

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.15.0" ./source

      - name: Build and smoke-test executable
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name devai \
            --paths source/src \
            --collect-all devai \
            scripts/devai_cli_entry.py
          codesign --force --deep --sign - dist/devai
          dist/devai --help
          dist/devai auth --help
          archive="devai-${VERSION}-darwin-${ARCH}.tar.gz"
          tar -C dist -czf "$archive" devai
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"

      - name: Upload packaged executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devai-${{ inputs.version }}-darwin-${{ matrix.arch }}
          path: |
            devai-${{ inputs.version }}-darwin-${{ matrix.arch }}.tar.gz
            devai-${{ inputs.version }}-darwin-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release and formula
    needs: build
    runs-on: macos-14
    steps:
      - name: Check out tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download packaged executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: devai-${{ inputs.version }}-darwin-*
          merge-multiple: true
          path: release-assets

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="devai-v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the DevAI version instead of replacing assets." >&2
            exit 1
          fi
          gh release create "$tag" release-assets/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "DevAI CLI ${VERSION}" \
            --notes "Install with: brew tap tesserix/tap && brew install devai"

      - name: Render and verify formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          amd64_sha="$(tr -d '[:space:]' < "release-assets/devai-${VERSION}-darwin-amd64.tar.gz.sha256")"
          arm64_sha="$(tr -d '[:space:]' < "release-assets/devai-${VERSION}-darwin-arm64.tar.gz.sha256")"
          python scripts/render_devai_formula.py \
            --version "$VERSION" \
            --amd64-sha256 "$amd64_sha" \
            --arm64-sha256 "$arm64_sha"
          brew style Formula/devai.rb
          brew audit --strict Formula/devai.rb
          brew install --formula ./Formula/devai.rb
          "$(brew --prefix)/bin/devai" --help

      - name: Commit formula update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/devai.rb
          git commit -m "chore(devai): update Homebrew formula to ${VERSION}"
          git push origin HEAD:main
